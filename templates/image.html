<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nhận diện từ ảnh</title>
  <style>
    .body {
    }

    .container {
      width: auto;
      height: 600px;
      background-color: #2D3748;
    }

    .container h2 {
      width: 500px;
      height: 40px;
      background-color: #4A5568;
      border-radius: 10px;
      color: #E2E8F0;
    }

    .container-form {
      width: auto;
      height: 300px;
      background-color: #4A5568;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container-form form {
      color: white;
    }

    .back-button {
      width: 180px;
      height: 20px;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
    }

    .body-button {
      height: auto;
      width: auto;
      color: black;
      text-decoration: none;
    }
  </style>
</head>
<body class="body">
  <div class="container">
    <h2>📂 Nhận diện vật nuôi từ ảnh có sẵn</h2>

    <div class="container-form">
      <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit">Upload & Detect</button>
      </form>
    </div>

  <br>
  <!-- <a href="/">⬅ Quay lại trang chính</a> -->
   <div class="back-button">
      <a href="/" class="body-button">⬅ Quay lại trang chính</a>

  </div>
  </div>
</body>
</html>
