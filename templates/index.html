<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetRecognize AI</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
    body {
      font-family: sans-serif;
      background-color: #1a202c; 
      color: #cbd5e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      width: 90%;
      max-width: 800px;
      padding: 0px;
    }
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 0px;
      background-color: #4a5568;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      height: 100px;
    }

    .logo img {
      width: 40px;
      height: 40px;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #e2e8f0;
    }


    .card {
      background-color: #2d3748;
      border-radius: 12px;
      padding:20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }


    .image-preview {
      width: 100%;
      max-width: 400px;
      height: 400px;
      border: 2px dashed #4a5568;
      border-radius: 8px;
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* background-image: url(../images/image-test/tải\ xuống.jpg); */
      background-repeat: no-repeat;
      background-position: center;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    .buttons-container {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #4a5568;
      color: #cbd5e0;
    }

    .btn-secondary:hover {
        background-color: #616f84;
    }

    .btn-primary {
        background-color: #4c51bf;
    }

    .btn-primary:hover {
        background-color: #5d61cc;
    }

    .btn-href {
      text-decoration: none;
      color: white;
    }

    @media (max-width: 600px) {
        .buttons-container {
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .btn {
            width: 100%;
        }
    }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <!-- <img src="" alt="PetRecognize AI Logo"> -->
                <div>
                  <h1>🐾 YOLOv8 Detection App</h1>
                  <h2>Nhận diện và quản lý vật nuôi trang trại</h2>
                </div>
            </div>
        </header>
        
        <main>
            <div class="card">
                <div class="image-preview">
                    <!-- <img id="petImage" src="../images/image-pet-preview.jpg" alt="Pet Preview"> -->
                    <img id="petImage" src="https://web-api.vemedim.vn/vmd-web-mediafile/file/f33b5129-7f30-4d61-9caf-dbca2ed57394" alt="Pet Preview">
                </div>
                
                <div class="buttons-container">
                    <input type="file" id="fileInput" hidden>
                    <button id="chooseFileBtn" class="btn btn-secondary"><a class="btn-href" href="/image">📂 Nhận diện vật nuôi thông qua ảnh có sẵn</a></button>
                    <button id="analyzeBtn" class="btn btn-primary"><a class="btn-href" href="/camera">📷 Nhận diện vật nuôi trực tiếp qua camera</a></button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
